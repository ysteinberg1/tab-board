<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sticky Notes have moved</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ground:#ECEBE4; --sticky:#FBF6DA; --sticky-edge:#EFE7BF; --ink:#2A2617; --ink-soft:#6D674E; --ink-faint:#9B9578; --marker:#A93B2C; }
  *{box-sizing:border-box}
  body{ margin:0; background:var(--ground); color:var(--ink); font-family:"Instrument Sans",system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .wrap{ max-width:460px; margin:48px auto; padding:0 18px; }
  .card{ background:var(--sticky); border:1px solid var(--sticky-edge); box-shadow:0 1px 1px rgba(42,38,23,.07), 0 8px 16px -12px rgba(42,38,23,.45); padding:20px 22px; }
  h1{ margin:0 0 8px; font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 118,"wght" 700; font-size:15px; letter-spacing:.08em; text-transform:uppercase; }
  p{ margin:0 0 10px; }
  ul{ list-style:none; margin:14px 0 0; padding:0; border-top:1px solid rgba(42,38,23,.13); }
  li{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid rgba(42,38,23,.13); }
  li span:last-child{ font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; text-align:right; }
  li.bad span:last-child{ color:var(--marker); }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Sticky Notes have moved</h1>
    <p>Your sticky notes now live in <b>Deal Kanban</b>. Open the Deal Kanban tab on this board (or the Deals app on your phone) and tap <b>NOTES</b> at the top.</p>
    <p id="status">Moving the notes over…</p>
    <ul id="list"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.5/dist/main.js"></script>
<script>
/* The one-time hand-over to Deal Kanban (Yoel, 2026-10-09).
   Each person's board (pins, order, folds, Loose Ends) was kept in this app's
   Monday storage as tabboard:<userId>. That storage is shared by everyone who
   opens this view, so whoever opens it next hands every board over at once.
   Deal Kanban keeps a board only if that person has none there yet, so opening
   this again changes nothing. The links already moved separately; the notes
   text was always on the deal in Monday. The old app is in this repo's history. */

const DEAL_KANBAN = "https://deal-kanban.vercel.app/api/notes/import";
const PEOPLE = [
  {id:"64185041", name:"Ari"},
  {id:"98067893", name:"Chuny"},
  {id:"64132011", name:"Shragie"},
  {id:"62940878", name:"Yoel"},
];

const monday = mondaySdk();
const statusEl = document.getElementById("status");
const list = document.getElementById("list");
let done = false;

function row(name, text, bad){
  const li = document.createElement("li");
  if(bad) li.className = "bad";
  const a = document.createElement("span"); a.textContent = name;
  const b = document.createElement("span"); b.textContent = text;
  li.appendChild(a); li.appendChild(b); list.appendChild(li);
}

monday.listen("context", async res => {
  if(done) return;
  const me = res && res.data && res.data.user && String(res.data.user.id);
  if(!me) return;
  done = true;

  const people = PEOPLE.slice();
  if(!people.some(p => p.id === me)) people.push({id:me, name:"You"});

  let moved = 0;
  for(const p of people){
    try{
      const r = await monday.storage.instance.getItem("tabboard:" + p.id);
      const raw = r && r.data && r.data.value;
      if(!raw){ row(p.name, "Nothing to move"); continue; }
      const board = JSON.parse(raw);
      const resp = await fetch(DEAL_KANBAN, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({mondayUserId: p.id, board}),
      });
      const out = await resp.json();
      if(!out.ok) throw new Error(out.error || "refused");
      const n = (board.pinned || []).length;
      row(p.name, out.stored ? `Moved, ${n} note${n===1?"":"s"}` : "Already moved");
      moved++;
    }catch(e){
      console.error(e);
      row(p.name, "Didn't move. Tell Yoel.", true);
    }
  }
  statusEl.textContent = moved ? "Done. Everything below is in Deal Kanban now." : "Nothing left to move.";
});
</script>
</body>
</html>
