<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#ECEBE4;
    --sticky:#FBF6DA;
    --sticky-edge:#EFE7BF;
    --sticky-fold:#F2E9C0;
    --loose:#FAE9E2;
    --loose-edge:#EED8CE;
    --loose-fold:#F2D9CE;
    --ink:#2A2617;
    --ink-soft:#6D674E;
    --ink-faint:#9B9578;
    --rule:rgba(42,38,23,.13);
    --marker:#A93B2C;
    --ribbon:#DFD3A4;
    --ribbon-ink:#4E4620;
    --warm:#D89A2E;
    --hot:#C2543F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0; min-height:100%}
  body{
    background:var(--ground); color:var(--ink);
    font-family:"Instrument Sans",system-ui,sans-serif;
    font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }

  .rail{
    display:flex; align-items:center; gap:14px;
    padding:13px 22px; border-bottom:1px solid var(--rule);
    background:var(--ground); position:sticky; top:0; z-index:20;
  }
  .rail-side{display:flex; align-items:center; gap:14px; flex:1}
  .rail-side.right{justify-content:flex-end}
  .rail h1{
    margin:0; font-family:"Archivo",sans-serif;
    font-variation-settings:"wdth" 118,"wght" 700;
    font-size:14px; letter-spacing:.10em; text-transform:uppercase;
  }
  .picker{display:none; align-items:center; gap:7px; padding-left:14px; border-left:1px solid var(--rule)}
  .picker.on{display:flex}
  .picker label{
    font-family:"JetBrains Mono",monospace; font-size:10px;
    letter-spacing:.07em; text-transform:uppercase; color:var(--ink-faint);
  }
  select{
    font-family:"Instrument Sans",sans-serif; font-size:13px; font-weight:500;
    color:var(--ink); background:#fff; border:1px solid var(--rule);
    border-radius:2px; padding:5px 8px; cursor:pointer; max-width:190px;
  }
  select:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
  .readonly{
    font-family:"JetBrains Mono",monospace; font-size:10px;
    letter-spacing:.06em; text-transform:uppercase; color:var(--marker);
    border:1px solid currentColor; border-radius:2px; padding:3px 6px; display:none;
  }
  .readonly.on{display:inline-block}
  .rail .spacer{flex:1}
  .saving{
    font-family:"JetBrains Mono",monospace; font-size:10px;
    letter-spacing:.05em; text-transform:uppercase; color:var(--ink-faint);
    opacity:0; transition:opacity .2s ease;
  }
  .saving.on{opacity:1}
  .saving.err{color:var(--marker); opacity:1}
  .btn{
    font-family:"Instrument Sans",sans-serif; font-size:13px; font-weight:500;
    color:var(--ink); background:#fff; border:1px solid var(--rule);
    border-radius:2px; padding:7px 13px; cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .btn:hover:not(:disabled){background:#fffdf5; transform:translateY(-1px)}
  .btn:disabled{opacity:.4; cursor:not-allowed}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  .btn.addnote{
    position:relative; width:62px; height:46px; padding:0;
    background:var(--sticky); border:1px solid var(--sticky-edge);
    display:grid; place-items:center; overflow:hidden;
    box-shadow:0 1px 1px rgba(42,38,23,.07);
    transition:box-shadow .15s ease, transform .15s ease, background .12s ease;
  }
  .btn.addnote:hover:not(:disabled){
    background:var(--sticky); transform:translateY(-1px);
    box-shadow:0 8px 15px -8px rgba(42,38,23,.4);
  }
  .btn.addnote .addnote-plus{
    font-family:"Archivo",sans-serif; font-size:25px; font-weight:400;
    color:var(--ink-soft); line-height:1;
    transition:color .15s ease, transform .15s ease;
  }
  .btn.addnote:hover:not(:disabled) .addnote-plus{ color:var(--marker); transform:scale(1.08); }
  .btn.addnote .addnote-fold{
    position:absolute; right:0; bottom:0; width:15px; height:15px;
    background:linear-gradient(135deg, transparent 50%, var(--sticky-fold) 50%);
    border-left:1px solid rgba(42,38,23,.08); border-top:1px solid rgba(42,38,23,.08);
    transition:width .18s cubic-bezier(.2,.8,.3,1), height .18s cubic-bezier(.2,.8,.3,1), border-color .18s ease;
  }
  .btn.addnote:hover:not(:disabled) .addnote-fold{
    width:26px; height:26px;
    border-left-color:rgba(42,38,23,.22); border-top-color:rgba(42,38,23,.22);
  }
  .btn.addnote:focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  .board{
    padding:22px; display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:18px; align-items:start;
  }
  .card{
    background:var(--sticky); border:1px solid var(--sticky-edge);
    border-radius:1px; position:relative; overflow:hidden;
    container-type:inline-size;
    box-shadow:0 1px 1px rgba(42,38,23,.07), 0 8px 16px -12px rgba(42,38,23,.45);
    transition:box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .card.loose{background:var(--loose); border-color:var(--loose-edge)}
  .card.over{
    box-shadow:0 0 0 2px var(--ink), 0 14px 26px -14px rgba(42,38,23,.55);
    transform:translateY(-3px) rotate(-.35deg);
  }
  .card.shifting{opacity:.35}
  .card.slot{box-shadow:0 0 0 2px var(--ink-soft); transform:translateY(-2px)}
  .card.aside{opacity:.7}

  .corner{
    position:absolute; right:0; bottom:0; width:20px; height:20px;
    border:0; padding:0; cursor:pointer; background:transparent; z-index:3;
  }
  .corner::before{
    content:""; position:absolute; right:0; bottom:0; width:16px; height:16px;
    background:linear-gradient(135deg, transparent 50%, var(--sticky-fold) 50%);
    border-left:1px solid rgba(42,38,23,.07);
    border-top:1px solid rgba(42,38,23,.07);
    transition:width .13s ease, height .13s ease;
  }
  .card.loose .corner::before{background:linear-gradient(135deg, transparent 50%, var(--loose-fold) 50%)}
  .corner:hover::before{width:20px;height:20px}
  .corner:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}

  .ribbon{
    background:var(--ribbon); color:var(--ribbon-ink);
    padding:6px 12px; border-bottom:1px solid rgba(42,38,23,.12);
    font-family:"JetBrains Mono",monospace; font-size:10px;
    letter-spacing:.04em; text-transform:uppercase;
  }

  .card-head{
    padding:11px 11px 10px 15px; border-bottom:1px solid var(--rule);
    display:flex; align-items:flex-start; gap:9px;
  }
  .card.folded .card-head{border-bottom:0}
  .card-head.grab{cursor:grab}
  .card-head.grab:active{cursor:grabbing}
  .name-wrap{flex:1; min-width:0}
  .card-name{
    margin:0; font-family:"Archivo",sans-serif;
    font-variation-settings:"wdth" 112,"wght" 700;
    font-size:13.5px; letter-spacing:.055em; text-transform:uppercase; line-height:1.4;
  }
  .open{
    display:inline-flex; vertical-align:-2px;
    border:0; background:transparent; cursor:pointer; padding:2px;
    color:var(--ink-faint); line-height:0; border-radius:2px;
  }
  .open:hover{color:var(--ink); background:rgba(255,255,255,.6)}
  .open:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
  .open svg{width:11px;height:11px;display:block}

  .status{
    display:inline-block; padding:1px 7px; border-radius:2px; max-width:100%;
    font-family:"Instrument Sans",sans-serif; font-size:10px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:.015em;
  }
  .status-below{margin-top:5px}
  .status-inline{display:none}
  @container (min-width: 300px){
    .status-inline{display:inline-block; max-width:150px}
    .status-below{display:none}
  }

  .controls{flex:none; display:flex; align-items:center; gap:3px}
  .since{
    min-width:29px; text-align:center;
    font-family:"JetBrains Mono",monospace; font-size:10px;
    color:var(--ink-soft); background:rgba(255,255,255,.6);
    border:1px solid var(--rule); border-radius:2px; padding:2px 5px;
  }
  .since.warm{background:var(--warm); border-color:var(--warm); color:#fff}
  .since.hot{background:var(--hot); border-color:var(--hot); color:#fff}
  .icon-btn{
    flex:none; border:0; background:transparent; cursor:pointer;
    color:var(--ink-faint); padding:2px 3px; border-radius:2px; line-height:0;
    opacity:.55; transition:opacity .12s ease, color .12s ease, background .12s ease;
  }
  .icon-btn:hover{opacity:1; color:var(--ink); background:rgba(255,255,255,.7)}
  .icon-btn.kill:hover{color:var(--marker)}
  .icon-btn.on{opacity:1; color:var(--ink)}
  .icon-btn svg{width:13px;height:13px;display:block}
  .icon-btn:focus-visible{outline:2px solid var(--ink); outline-offset:1px; opacity:1}

  .card.folded .body{display:none}

  .links{list-style:none;margin:0;padding:6px 0}
  .slip{display:flex; align-items:center; gap:9px; padding:6px 11px 6px 15px; position:relative}
  .slip:hover{background:rgba(255,255,255,.5)}
  .slip.drag{cursor:grab}
  .slip.ghost{opacity:.35}
  .fav{
    width:17px;height:17px;flex:none;border-radius:2px;
    display:grid;place-items:center;overflow:hidden;
    font-family:"Archivo",sans-serif;font-size:9px;font-weight:700;color:#fff;
    box-shadow:0 0 0 1px rgba(42,38,23,.10);
  }
  .fav img{width:17px;height:17px;display:block}
  .slip a{
    color:var(--ink); text-decoration:none; font-size:13px; line-height:1.3;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;
  }
  .slip a:hover{text-decoration:underline}
  .slip input.rename{
    flex:1; min-width:0; font-family:"Instrument Sans",sans-serif; font-size:13px;
    color:var(--ink); background:#fff; border:1px solid var(--rule);
    border-radius:2px; padding:2px 6px;
  }
  .slip input.rename:focus{outline:2px solid var(--ink); outline-offset:-1px}
  input.rename-card{
    width:100%; font-family:"Archivo",sans-serif; font-variation-settings:"wdth" 112,"wght" 700;
    font-size:13.5px; letter-spacing:.055em; text-transform:uppercase;
    color:var(--ink); background:#fff; border:1px solid var(--rule);
    border-radius:2px; padding:3px 6px;
  }
  input.rename-card:focus{outline:2px solid var(--ink); outline-offset:-1px}
  .slip .tools{display:flex; align-items:center; gap:1px; flex:none}
  .slip .tools button{
    border:0; background:transparent; cursor:pointer; color:var(--ink-faint);
    padding:2px 3px; border-radius:2px; line-height:0;
    opacity:.5; transition:opacity .12s ease, color .12s ease, background .12s ease;
  }
  .slip:hover .tools button{opacity:.8}
  .slip .tools button:hover{opacity:1; color:var(--ink); background:rgba(255,255,255,.8)}
  .slip .tools button.kill:hover{color:var(--marker)}
  .slip .tools button:focus-visible{opacity:1; outline:2px solid var(--ink); outline-offset:1px}
  .slip .tools svg{width:12px;height:12px;display:block}
  .slip .promote{
    border:0; background:transparent; cursor:pointer; white-space:nowrap;
    font-family:"Instrument Sans",sans-serif; font-size:11px; font-weight:500;
    color:var(--ink-soft); padding:2px 4px; opacity:0; transition:opacity .12s ease;
  }
  .slip:hover .promote, .slip .promote:focus-visible{opacity:1}
  .slip .promote:hover{color:var(--ink); text-decoration:underline}

  @keyframes land{
    0%{opacity:0; transform:translateY(-9px) rotate(-1.4deg)}
    70%{opacity:1; transform:translateY(1px) rotate(.3deg)}
    100%{opacity:1; transform:none}
  }
  .slip.new{animation:land .34s cubic-bezier(.2,.8,.3,1)}

  .more{
    display:flex; align-items:center; gap:6px;
    width:100%; text-align:left; cursor:pointer;
    border:0; background:transparent; padding:5px 15px 6px;
    font-family:"Instrument Sans",sans-serif; font-size:11.5px; color:var(--ink-soft);
  }
  .more:hover{color:var(--ink)}
  .more:focus-visible{outline:2px solid var(--ink); outline-offset:-2px}
  .more .tri{display:inline-block; font-size:9px; line-height:1; color:var(--ink-faint); transition:transform .13s ease}
  .more.open .tri{transform:rotate(90deg)}

  .note-wrap{border-top:1px solid var(--rule); padding:9px 15px 10px}
  .note-text{font-size:12.5px; color:var(--ink); white-space:pre-wrap; cursor:text; min-height:17px; line-height:1.5}
  .note-text.empty{color:var(--ink-faint); font-style:italic}
  .note-text:hover{text-decoration:underline dotted rgba(42,38,23,.25)}
  textarea{
    width:100%; min-height:62px; resize:vertical;
    font-family:"Instrument Sans",sans-serif; font-size:12.5px; line-height:1.5;
    color:var(--ink); background:rgba(255,255,255,.7);
    border:1px solid var(--rule); border-radius:2px; padding:7px 8px;
  }
  textarea:focus{outline:2px solid var(--ink); outline-offset:-1px}

  .hint{
    display:flex; align-items:center; gap:8px;
    padding:8px 26px 12px 15px; font-size:11.5px; color:var(--ink-faint);
    border-top:1px solid var(--rule);
  }
  .hint span{flex:1}
  .card.over .hint span{color:var(--ink); font-weight:600}
  .paste{
    border:1px solid var(--rule); background:rgba(255,255,255,.55);
    color:var(--ink-soft); border-radius:2px; cursor:pointer;
    font-family:"JetBrains Mono",monospace; font-size:10px;
    letter-spacing:.05em; text-transform:uppercase; padding:3px 8px;
  }
  .paste:hover{color:var(--ink); border-color:var(--ink); background:#fff}
  .paste:focus-visible{outline:2px solid var(--ink); outline-offset:1px}

  .veil{
    position:fixed; top:0; right:0; bottom:0; left:0;
    width:100vw; height:100vh;
    background:rgba(42,38,23,.38); display:none; place-items:center; z-index:9999;
  }
  .veil.open{display:grid}
  .modal{
    width:min(420px,92vw); background:var(--sticky);
    border:1px solid var(--sticky-edge); border-radius:1px;
    box-shadow:0 22px 54px -22px rgba(0,0,0,.55); padding:18px;
  }
  .modal h2{
    margin:0 0 12px; font-family:"Archivo",sans-serif;
    font-variation-settings:"wdth" 112,"wght" 700;
    font-size:12.5px; letter-spacing:.09em; text-transform:uppercase;
  }
  .modal input{
    width:100%; padding:9px 11px; font-size:14px;
    font-family:"Instrument Sans",sans-serif;
    border:1px solid var(--rule); border-radius:2px; background:#fffdf3; color:var(--ink);
  }
  .modal input:focus{outline:2px solid var(--ink); outline-offset:-1px}
  .results{list-style:none;margin:12px 0 0;padding:0;max-height:250px;overflow:auto}
  .results li button{
    width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
    padding:8px 9px; font-family:"Instrument Sans",sans-serif; font-size:13.5px;
    color:var(--ink); border-radius:2px; display:flex; align-items:center; gap:8px;
  }
  .results li button:hover{background:rgba(255,255,255,.55)}

  .state{
    padding:60px 22px; text-align:center; color:var(--ink-soft); font-size:13px;
  }
  .state strong{display:block; font-family:"Archivo",sans-serif;
    font-variation-settings:"wdth" 112,"wght" 700; font-size:13px;
    letter-spacing:.06em; text-transform:uppercase; margin-bottom:7px; color:var(--ink)}
  .state code{
    font-family:"JetBrains Mono",monospace; font-size:11.5px;
    background:rgba(255,255,255,.6); padding:1px 5px; border-radius:2px;
  }

  @media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>
<body>

<div class="rail">
  <div class="rail-side left">
    <h1>Sticky Notes</h1>
    <div class="picker" id="picker">
      <label for="who">Viewing</label>
      <select id="who"></select>
      <span class="readonly" id="ro">Read only</span>
    </div>
  </div>
  <button class="btn addnote" id="addNoteBtn" title="Add a sticky note" aria-label="Add a sticky note">
    <span class="addnote-plus">+</span>
    <span class="addnote-fold"></span>
  </button>
  <div class="rail-side right">
    <span class="saving" id="saving">Saving</span>
  </div>
</div>

<div class="board" id="board"></div>
<div class="state" id="state"><strong>Loading</strong>Reading the board.</div>

<div class="veil" id="veil">
  <div class="modal" role="dialog" aria-label="Pin a deal">
    <h2>Pin a deal</h2>
    <input id="search" type="text" placeholder="Type a customer name" autocomplete="off">
    <ul class="results" id="results"></ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monday-sdk-js@0.5.5/dist/main.js"></script>
<script>
/* ============================================================
   CONFIG — the only things you should ever need to change
   ============================================================ */
const CFG = {
  NOTES_COL:   "long_text_mm6khzqt",  // Sales notes (long text)
  LINKS_COL:   "long_text_mm6k5rkn",  // Links (long text)
  STATUS_COL:  "deal_stage",          // Stage
  ADDRESS_COL: "location_mkv04x3y",   // Facility Address
  CLOSED_LABELS: ["Won","Lost","Won- Move to PM"],  // labels that trigger the clearing ribbon
  CLEAR_AFTER: 3,                      // days a closed deal stays on the board
  WARM_AT: 21,                         // days untouched -> amber badge
  HOT_AT: 42,                          // days untouched -> red badge
  SHOW_LINKS: 3,                       // links shown before the "more" triangle
  MAX_ITEMS: 1000,                     // safety cap on the background search index
                                        // (name/status/address only — the board itself
                                        // can hold far more; pinned deals always load
                                        // regardless of this number)
  // Only these people show up in the "Viewing" picker (plus whoever is
  // actually logged in, so an owner previewing always sees themselves too).
  SALES_TEAM: [
    {id:"64185041", name:"Ari Weber", salesLabel:"Ari"},
    {id:"98067893", name:"Chuny Koenig", salesLabel:"Chuny"},
    {id:"64132011", name:"Shragie Gobioff", salesLabel:"Shragie"},
  ],
  // Blank sticky notes land here as real Monday items, invisible to the
  // shared "pin a deal" search, until someone converts them to a real deal.
  STICKY_GROUP: "group_mm6rsksd",
  ACTIVE_GROUP: "topics",
  SALESMAN_COL: "color_mkv0qrwq",   // set on Convert to deal; "Other" for non-team creators
};

const DAY = 86400000;
const monday = mondaySdk();

/* ============================================================
   State
   ============================================================ */
let ctx = null;            // monday context
let boardId = null;
let meId = null;
let isOwner = false;
let viewing = null;        // user id whose board we're showing

let deals = [];            // [{id,name,stage,color,closedAt,notes,links:[]}]
let dealsById = new Map();
let people = [];           // [{id,name}]
let statusColId = null;
let statusColors = {};     // label -> hex

let userBoards = new Map();  // userId -> {pinned:[{dealId,folded,aside,touchedAt}], loose:[], looseNote:""}

let searchIndex = [];      // lightweight {id,name,stage,address,groupId} for every deal — loaded in the background
let indexReady = false;    // true once searchIndex has finished its first load

const expanded = new Set();
const editing = new Set();
const renaming = new Set();
const renamingCard = new Set();  // deal ids currently showing a rename input for the card name
let dragCard = null, dragLink = null;
let uid = 0;

const editable = () => viewing === meId;
const myBoard = () => userBoards.get(viewing) || {pinned:[], loose:[], looseNote:""};

/* ============================================================
   Small helpers
   ============================================================ */
function host(u){ try{ return new URL(u).hostname.replace(/^www\./,""); }catch{ return u; } }
function tint(str){ let h=0; for(const c of str) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 36% 44%)`; }
function favicon(url){
  const el = document.createElement("span");
  el.className="fav";
  const h = host(url);
  el.style.background = tint(h);
  el.textContent = h.charAt(0).toUpperCase();
  const img = new Image();
  img.src = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(h)}&sz=64`;
  img.alt="";
  img.onload = () => { el.textContent=""; el.style.background="transparent"; el.appendChild(img); };
  return el;
}
function hexToHsl(hex){
  const m = (hex||"#888888").replace("#","");
  const r=parseInt(m.slice(0,2),16)/255, g=parseInt(m.slice(2,4),16)/255, b=parseInt(m.slice(4,6),16)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
  let h=0,s=0; const l=(mx+mn)/2, d=mx-mn;
  if(d){
    s = l>.5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx===r) h=((g-b)/d+(g<b?6:0)); else if(mx===g) h=(b-r)/d+2; else h=(r-g)/d+4;
    h*=60;
  }
  return {h,s:s*100,l:l*100};
}
function muted(hex){
  const {h,s} = hexToHsl(hex);
  return {
    bg:  `hsl(${h.toFixed(0)} ${Math.min(s*.52,46).toFixed(0)}% 84%)`,
    fg:  `hsl(${h.toFixed(0)} ${Math.min(s*.60,52).toFixed(0)}% 27%)`,
    edge:`hsl(${h.toFixed(0)} ${Math.min(s*.45,40).toFixed(0)}% 74%)`,
  };
}
function since(ts){
  const d = Math.floor((Date.now()-ts)/DAY);
  if(d<=0) return "today";
  if(d<7) return d+"d";
  if(d<60) return Math.round(d/7)+"w";
  return Math.round(d/30)+"mo";
}
function isClosed(deal){ return CFG.CLOSED_LABELS.includes(deal.stage); }
function isBlankNote(deal){ return deal.groupId === CFG.STICKY_GROUP; }
function daysLeft(deal){
  if(!deal.closedAt) return CFG.CLEAR_AFTER;
  return CFG.CLEAR_AFTER - Math.floor((Date.now()-deal.closedAt)/DAY);
}
function icon(p){
  return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
}
const ICON_CLOCK  = icon('<circle cx="8" cy="9" r="5.2"/><path d="M8 6.4V9l1.8 1.1"/><path d="M3.1 3.6l1.6-1.4M12.9 3.6l-1.6-1.4"/>');
const ICON_X      = icon('<path d="M4 4l8 8M12 4l-8 8"/>');
const ICON_PENCIL = icon('<path d="M11.2 2.9l1.9 1.9L6 11.9l-2.4.5.5-2.4z"/>');
const ICON_OPEN   = icon('<path d="M13 9v3.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1H7"/><path d="M10 2.5h3.5V6"/><path d="M7.5 8.5l6-6"/>');
const ICON_CONVERT = icon('<path d="M3 8h9"/><path d="M8.5 4.5L12 8l-3.5 3.5"/>');

/* readable names from a bare URL */
const SMALL = new Set(["of","the","and","at","in","on","for","to","a"]);
function titleCase(s){
  return s.split(" ").filter(Boolean).map((w,i)=>
    (i>0 && SMALL.has(w.toLowerCase())) ? w.toLowerCase() : w.charAt(0).toUpperCase()+w.slice(1)
  ).join(" ");
}
function prettyName(url){
  let u; try{ u = new URL(url); }catch{ return url; }
  const h = u.hostname.replace(/^www\./,"");
  const parts = u.pathname.split("/").filter(Boolean);
  const deslug = s => titleCase(decodeURIComponent(s).replace(/[-_+]/g," ").replace(/\.\w{2,4}$/,"").trim());
  const q = u.searchParams.get("q") || u.searchParams.get("query");
  if(q) return titleCase(decodeURIComponent(q.replace(/\+/g," ")));
  if(h.endsWith("linkedin.com")){
    if(parts[0]==="in" && parts[1]) return deslug(parts[1]);
    if(parts[0]==="company" && parts[1]) return deslug(parts[1]);
  }
  if(h.endsWith("loopnet.com") || h.endsWith("crexi.com")){
    const seg = parts.find(p => /[a-z]/i.test(p) && p.toLowerCase()!=="listing");
    if(seg) return deslug(seg);
  }
  if(h.includes("companycam")) return "CompanyCam" + (parts[1] ? " "+parts[1] : "");
  for(let i=parts.length-1;i>=0;i--){ if(/[a-z]{3}/i.test(parts[i])) return deslug(parts[i]); }
  return h;
}

/* ============================================================
   Saving indicator
   ============================================================ */
const savingEl = document.getElementById("saving");
let savingCount = 0;
function saveStart(){ savingCount++; savingEl.className="saving on"; savingEl.textContent="Saving"; }
function saveDone(ok, msg){
  savingCount = Math.max(0, savingCount-1);
  if(!ok){ savingEl.className="saving err"; savingEl.textContent = msg || "Not saved"; return; }
  if(savingCount===0){ savingEl.textContent="Saved"; setTimeout(()=>{ if(savingCount===0) savingEl.className="saving"; }, 900); }
}

/* ============================================================
   Monday reads
   ============================================================ */
async function api(query, variables){
  const res = await monday.api(query, {variables});
  if(res && res.errors && res.errors.length) throw new Error(res.errors[0].message);
  return res.data;
}

function parseLinks(raw){
  if(!raw) return [];
  try{
    const o = JSON.parse(raw);
    const arr = Array.isArray(o) ? o : (o.links || []);
    return arr.filter(x => x && x.u).map(x => ({
      id: ++uid,
      url: x.u,
      title: x.t || prettyName(x.u),
      named: !!x.t,
      ts: x.d ? Date.parse(x.d) : Date.now(),
    }));
  }catch{ return []; }
}
function serializeLinks(links){
  return JSON.stringify({
    v: 1,
    links: links.map(l => {
      const o = {u: l.url};
      if(l.named && l.title) o.t = l.title;
      o.d = new Date(l.ts).toISOString().slice(0,10);
      return o;
    }),
  });
}

/* full column set for an item we're actually going to show on the board */
const DEAL_COLS = [CFG.STATUS_COL, CFG.ADDRESS_COL, CFG.NOTES_COL, CFG.LINKS_COL];

function toDeal(it){
  const cv = {};
  (it.column_values||[]).forEach(c => cv[c.id] = c);
  const st = cv[CFG.STATUS_COL];
  let closedAt = null;
  if(st && st.value){
    try{
      const v = JSON.parse(st.value);
      if(v && v.changed_at) closedAt = Date.parse(v.changed_at);
    }catch{}
  }
  return {
    id: String(it.id),
    name: it.name,
    stage: (st && st.text) || "",
    address: (cv[CFG.ADDRESS_COL] && cv[CFG.ADDRESS_COL].text) || "",
    closedAt,
    notes: (cv[CFG.NOTES_COL] && cv[CFG.NOTES_COL].text) || "",
    links: parseLinks(cv[CFG.LINKS_COL] && cv[CFG.LINKS_COL].text),
    groupId: it.group ? it.group.id : null,
  };
}

/* board metadata only — no items. Fast, always needed at boot. */
async function loadMeta(){
  const data = await api(`
    query ($board: [ID!], $cols: [String!]) {
      boards (ids: $board) {
        name
        owners { id }
        columns (ids: $cols) { id title type settings_str }
      }
      me { id name is_admin }
    }
  `, {board: [String(boardId)], cols: DEAL_COLS});

  const board = data.boards && data.boards[0];
  if(!board) throw new Error("Board not found");

  meId = String(data.me.id);

  const ownerIds = new Set((board.owners||[]).map(o => String(o.id)));
  isOwner = data.me.is_admin === true || ownerIds.has(meId);

  /* the picker only ever shows the sales team, plus whoever is actually
     logged in — so an owner previewing the board still sees themselves */
  people = CFG.SALES_TEAM.slice();
  if(!people.some(p => p.id === meId)) people.unshift({id:meId, name:data.me.name});

  /* status column */
  statusColId = CFG.STATUS_COL;
  const statusCol = board.columns.find(c => c.id === statusColId);
  statusColors = {};
  if(statusCol && statusCol.settings_str){
    try{
      const s = JSON.parse(statusCol.settings_str);
      const labels = s.labels || {};
      const colors = s.labels_colors || {};
      Object.keys(labels).forEach(k => {
        const hex = colors[k] && (colors[k].color || colors[k].border);
        if(labels[k]) statusColors[labels[k]] = hex || null;
      });
    }catch{}
  }

  /* missing columns are a setup problem, not a runtime one */
  const has = id => board.columns.some(c => c.id === id);
  if(!has(CFG.NOTES_COL) || !has(CFG.LINKS_COL)){
    const missing = [CFG.NOTES_COL, CFG.LINKS_COL].filter(id => !has(id));
    throw new Error("SETUP:" + missing.join(", "));
  }
}

/* fetch specific items by id — used for whatever a user actually has
   pinned, instead of pulling the whole board every time the view opens */
async function loadItemsByIds(ids){
  if(!ids.length) return [];
  const data = await api(`
    query ($ids: [ID!], $cols: [String!]) {
      items (ids: $ids) {
        id
        name
        group { id }
        column_values (ids: $cols) { id text value }
      }
    }
  `, {ids, cols: DEAL_COLS});
  return (data.items||[]).map(toDeal);
}

/* the Sticky Notes group is small and bounded (only ever holds
   not-yet-converted notes) — fetched in full every load so naming
   never collides and a note is never missed regardless of board size */
async function loadStickyGroup(){
  const data = await api(`
    query ($board: [ID!], $cols: [String!], $g: [String!]) {
      boards (ids: $board) {
        groups (ids: $g) {
          items_page (limit: 200) {
            items { id name group { id } column_values (ids: $cols) { id text value } }
          }
        }
      }
    }
  `, {board: [String(boardId)], cols: DEAL_COLS, g: [CFG.STICKY_GROUP]});
  const grp = data.boards && data.boards[0] && data.boards[0].groups && data.boards[0].groups[0];
  return ((grp && grp.items_page.items) || []).map(toDeal);
}

/* lightweight, paginated scan of the Active Deals group only — name/status/
   address, no notes or links — used solely to power the "pin a deal" search.
   Scoped to just that one group so Closed Won, Lost, and Sticky Notes are
   never fetched at all, not just filtered out afterward. Runs in the
   background after the board itself is already on screen. */
async function loadSearchIndex(){
  const cols = [CFG.STATUS_COL, CFG.ADDRESS_COL];
  const items = [];
  try{
    let data = await api(`
      query ($board: [ID!], $cols: [String!], $g: [String!]) {
        boards (ids: $board) {
          groups (ids: $g) {
            items_page (limit: 250) {
              cursor
              items { id name group { id } column_values (ids: $cols) { id text } }
            }
          }
        }
      }
    `, {board: [String(boardId)], cols, g: [CFG.ACTIVE_GROUP]});
    let page = data.boards && data.boards[0] && data.boards[0].groups && data.boards[0].groups[0] && data.boards[0].groups[0].items_page;
    items.push(...((page && page.items) || []));
    let cursor = page && page.cursor;
    while(cursor && items.length < CFG.MAX_ITEMS){
      const next = await api(`
        query ($cursor: String!, $cols: [String!]) {
          next_items_page (limit: 250, cursor: $cursor) {
            cursor
            items { id name group { id } column_values (ids: $cols) { id text } }
          }
        }
      `, {cursor, cols});
      const np = next.next_items_page;
      items.push(...((np && np.items) || []));
      cursor = np && np.cursor;
    }
    searchIndex = items.map(it => {
      const cv = {};
      (it.column_values||[]).forEach(c => cv[c.id] = c);
      return {
        id: String(it.id),
        name: it.name,
        stage: (cv[CFG.STATUS_COL] && cv[CFG.STATUS_COL].text) || "",
        address: (cv[CFG.ADDRESS_COL] && cv[CFG.ADDRESS_COL].text) || "",
        groupId: it.group ? it.group.id : null,
      };
    });
  }catch(e){
    console.warn("search index load failed", e);
  }
  indexReady = true;
  if(veil.classList.contains("open")) drawResults(search.value);
}

async function loadUserBoard(userId){
  if(userBoards.has(userId)) return userBoards.get(userId);
  let rec = {pinned:[], loose:[], looseNote:""};
  try{
    const res = await monday.storage.instance.getItem("tabboard:"+userId);
    const raw = res && res.data && res.data.value;
    if(raw){
      const o = JSON.parse(raw);
      rec = {
        pinned: (o.pinned||[]).map(p => ({
          dealId: String(p.dealId),
          folded: !!p.folded,
          aside: !!p.aside,
          touchedAt: p.touchedAt || 0,
        })),
        loose: (o.loose||[]).map(l => ({
          id: ++uid, url: l.u, title: l.t || prettyName(l.u),
          named: !!l.t, ts: l.d ? Date.parse(l.d) : Date.now(),
        })),
        looseNote: o.looseNote || "",
      };
    }
  }catch(e){ console.warn("storage read failed", e); }
  userBoards.set(userId, rec);
  return rec;
}

/* ============================================================
   Monday writes
   ============================================================ */
let storageTimer = null;
function saveUserBoard(userId){
  clearTimeout(storageTimer);
  storageTimer = setTimeout(async () => {
    const rec = userBoards.get(userId);
    if(!rec) return;
    const payload = JSON.stringify({
      v: 1,
      pinned: rec.pinned.map(p => ({dealId:p.dealId, folded:p.folded, aside:p.aside, touchedAt:p.touchedAt})),
      loose: rec.loose.map(l => {
        const o = {u:l.url};
        if(l.named && l.title) o.t = l.title;
        o.d = new Date(l.ts).toISOString().slice(0,10);
        return o;
      }),
      looseNote: rec.looseNote,
    });
    saveStart();
    try{
      await monday.storage.instance.setItem("tabboard:"+userId, payload);
      saveDone(true);
    }catch(e){
      console.error(e);
      saveDone(false, "Board not saved");
    }
  }, 400);
}

const colTimers = new Map();
function saveColumn(dealId, colId, value){
  const key = dealId+":"+colId;
  clearTimeout(colTimers.get(key));
  colTimers.set(key, setTimeout(async () => {
    saveStart();
    try{
      await api(`
        mutation ($board: ID!, $item: ID!, $col: String!, $val: String!) {
          change_simple_column_value (board_id:$board, item_id:$item, column_id:$col, value:$val, create_labels_if_missing:false) { id }
        }
      `, {board:String(boardId), item:String(dealId), col:colId, val:value});
      saveDone(true);
    }catch(e){
      console.error(e);
      saveDone(false, /exceed|length|long/i.test(e.message) ? "Too long to save" : "Not saved");
    }
  }, 500));
}
function saveLinks(deal){ saveColumn(deal.id, CFG.LINKS_COL, serializeLinks(deal.links)); }
function saveNotes(deal){ saveColumn(deal.id, CFG.NOTES_COL, deal.notes || ""); }

/* the item's own name isn't a normal column — it's set through the
   "name" key in change_multiple_column_values instead */
async function saveItemName(deal, name){
  const prev = deal.name;
  deal.name = name;
  saveStart();
  try{
    await api(`
      mutation ($board: ID!, $item: ID!, $values: JSON!) {
        change_multiple_column_values (board_id:$board, item_id:$item, column_values:$values) { id }
      }
    `, {board:String(boardId), item:String(deal.id), values: JSON.stringify({name})});
    saveDone(true);
  }catch(e){
    console.error(e);
    deal.name = prev;
    saveDone(false, "Couldn't rename");
    render();
  }
}

/* moves a not-yet-converted note into Active Deals and assigns the
   Salesman column to whoever converted it — "Other" for anyone not on
   the sales team (e.g. an owner/admin previewing the app) */
async function convertToDeal(deal){
  saveStart();
  try{
    await api(`
      mutation ($item: ID!, $group: String!) {
        move_item_to_group (item_id:$item, group_id:$group) { id }
      }
    `, {item:String(deal.id), group:CFG.ACTIVE_GROUP});
    const person = CFG.SALES_TEAM.find(p => p.id === meId);
    const label = person ? person.salesLabel : "Other";
    await api(`
      mutation ($board: ID!, $item: ID!, $values: JSON!) {
        change_multiple_column_values (board_id:$board, item_id:$item, column_values:$values) { id }
      }
    `, {board:String(boardId), item:String(deal.id), values: JSON.stringify({[CFG.SALESMAN_COL]: {label}})});
    deal.groupId = CFG.ACTIVE_GROUP;
    saveDone(true);
    render();
  }catch(e){
    console.error(e);
    saveDone(false, "Couldn't convert");
  }
}

/* only reachable for a note still sitting in the Sticky Notes group —
   nobody else could have found or pinned it, so this can never delete
   something out from under another salesman */
async function deleteBlankNote(deal, pin){
  saveStart();
  try{
    await api(`mutation ($item: ID!) { delete_item (item_id:$item) { id } }`, {item:String(deal.id)});
    const rec = myBoard();
    rec.pinned = rec.pinned.filter(p => p !== pin);
    dealsById.delete(deal.id);
    deals = deals.filter(d => d.id !== deal.id);
    saveUserBoard(viewing);
    saveDone(true);
    render();
  }catch(e){
    console.error(e);
    saveDone(false, "Couldn't delete");
  }
}

/* ============================================================
   Touch tracking — moving/folding is not working the deal
   ============================================================ */
function pinOf(dealId){ return myBoard().pinned.find(p => p.dealId === dealId); }
function touch(dealId){
  const p = pinOf(dealId);
  if(p){ p.touchedAt = Date.now(); saveUserBoard(viewing); }
}
function lastTouched(deal, pin){
  const ts = deal.links.map(l => l.ts);
  if(pin && pin.touchedAt) ts.push(pin.touchedAt);
  return ts.length ? Math.max(...ts) : 0;
}
function heat(deal, pin){
  if(pin && pin.aside) return "";
  const lt = lastTouched(deal, pin);
  if(!lt) return "";
  const d = (Date.now()-lt)/DAY;
  return d >= CFG.HOT_AT ? "hot" : d >= CFG.WARM_AT ? "warm" : "";
}

const board = document.getElementById("board");
const stateEl = document.getElementById("state");

function statusEl(stage, where){
  const s = document.createElement("span");
  s.className = "status " + (where||"");
  const hex = statusColors[stage];
  if(hex){
    const m = muted(hex);
    s.style.background = m.bg; s.style.color = m.fg;
    s.style.boxShadow = "inset 0 0 0 1px "+m.edge;
  }else{
    s.style.color = "var(--ink-faint)";
  }
  s.textContent = stage || "—";
  s.title = stage || "";
  return s;
}

function addLink(url, deal){
  const list = deal ? deal.links : myBoard().loose;
  if(list.some(l => l.url === url)) return null;
  const link = {id:++uid, url, title:prettyName(url), named:false, ts:Date.now()};
  list.unshift(link);
  if(deal){
    const p = pinOf(deal.id);
    if(p){ p.aside=false; p.folded=false; p.touchedAt=Date.now(); }
    saveLinks(deal); saveUserBoard(viewing);
  }else{
    saveUserBoard(viewing);
  }
  return link;
}

function slipEl(link, deal){
  const li = document.createElement("li");
  li.className = "slip" + (editable() ? " drag" : "");
  li.appendChild(favicon(link.url));

  if(renaming.has(link.id) && editable()){
    const inp = document.createElement("input");
    inp.className="rename"; inp.value = link.title;
    inp.onblur = () => {
      const v = inp.value.trim();
      if(v && v !== link.title){
        link.title = v; link.named = true;
        if(deal){ saveLinks(deal); touch(deal.id); } else saveUserBoard(viewing);
      }
      renaming.delete(link.id); render();
    };
    inp.onkeydown = e => {
      if(e.key==="Enter") inp.blur();
      if(e.key==="Escape"){ renaming.delete(link.id); render(); }
    };
    li.appendChild(inp);
    setTimeout(()=>{ inp.focus(); inp.select(); },0);
    return li;
  }

  const a = document.createElement("a");
  a.href=link.url; a.target="_blank"; a.rel="noopener";
  a.textContent = link.title; a.title = link.url; a.draggable=false;
  li.appendChild(a);

  if(!editable()) return li;

  li.draggable = true;
  li.addEventListener("dragstart", e => {
    e.stopPropagation();
    dragLink = {linkId:link.id, fromDeal:deal};
    e.dataTransfer.effectAllowed="move";
    e.dataTransfer.setData("text/plain", link.url);
    li.classList.add("ghost");
  });
  li.addEventListener("dragend", () => { dragLink=null; li.classList.remove("ghost"); });

  const tools = document.createElement("div");
  tools.className="tools";

  const pen = document.createElement("button");
  pen.innerHTML = ICON_PENCIL; pen.title="Rename"; pen.setAttribute("aria-label","Rename link");
  pen.onclick = () => { renaming.add(link.id); render(); };
  tools.appendChild(pen);

  const x = document.createElement("button");
  x.className="kill"; x.innerHTML=ICON_X; x.title="Remove"; x.setAttribute("aria-label","Remove link");
  x.onclick = () => {
    if(deal){
      deal.links = deal.links.filter(l => l !== link);
      saveLinks(deal); touch(deal.id);
    }else{
      const rec = myBoard();
      rec.loose = rec.loose.filter(l => l !== link);
      saveUserBoard(viewing);
    }
    render();
  };
  tools.appendChild(x);
  li.appendChild(tools);
  return li;
}

function noteEl(key, getVal, setVal){
  const wrap = document.createElement("div");
  wrap.className="note-wrap";

  if(editing.has(key) && editable()){
    const ta = document.createElement("textarea");
    ta.value = getVal(); ta.placeholder="Type a note";
    ta.onblur = () => { setVal(ta.value.trim()); editing.delete(key); render(); };
    ta.onkeydown = e => {
      if(e.key==="Escape"){ editing.delete(key); render(); }
      if(e.key==="Enter" && (e.metaKey||e.ctrlKey)) ta.blur();
    };
    wrap.appendChild(ta);
    setTimeout(()=>{ ta.focus(); ta.selectionStart = ta.value.length; },0);
    return wrap;
  }

  const val = getVal();
  const p = document.createElement("div");
  p.className = "note-text" + (val ? "" : " empty");
  p.textContent = val || (editable() ? "Add a note" : "No notes");
  if(editable()){
    p.tabIndex = 0;
    p.onclick = () => { editing.add(key); render(); };
    p.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); editing.add(key); render(); } };
  }
  wrap.appendChild(p);
  return wrap;
}

function cardEl({deal, pin, index}){

        h3.appendChild(op);
      }
      /* rename is only for not-yet-converted notes \u2014 a real deal's name
         is the customer's name and shouldn't be casually editable here */
      if(editable() && isBlankNote(deal)){
        const pen = document.createElement("button");
        pen.className="open"; pen.innerHTML=ICON_PENCIL;
        pen.title="Rename"; pen.setAttribute("aria-label","Rename "+deal.name);
        pen.onclick = e => { e.stopPropagation(); renamingCard.add(deal.id); render(); };
        h3.appendChild(document.createTextNode("\u2009"));
        h3.appendChild(pen);

        const conv = document.createElement("button");
        conv.className="open"; conv.innerHTML=ICON_CONVERT;
        conv.title="Convert to deal"; conv.setAttribute("aria-label","Convert "+deal.name+" to a deal");
        conv.onclick = e => { e.stopPropagation(); convertToDeal(deal); };
        h3.appendChild(document.createTextNode("\u2009"));
        h3.appendChild(conv);
      }
    }
    nameWrap.appendChild(h3);
  }
  if(deal && !isBlankNote(deal)) nameWrap.appendChild(statusEl(deal.stage,"status-below"));
  head.appendChild(nameWrap);

  const controls = document.createElement("div");
  controls.className="controls";

  if(deal){
    if(!isBlankNote(deal)) controls.appendChild(statusEl(deal.stage,"status-inline"));
    const badge = document.createElement("span");
    badge.className = "since " + heat(deal, pin);
    const lt = lastTouched(deal, pin);
    badge.textContent = lt ? since(lt) : "—";
    badge.title = lt ? "Last worked "+since(lt)+" ago" : "Nothing on this card yet";
    controls.appendChild(badge);
  }

  if(editable() && !isLoose){
    const aside = document.createElement("button");
    aside.className = "icon-btn" + (pin.aside ? " on" : "");
    aside.innerHTML = ICON_CLOCK;
    aside.title = pin.aside ? "Bring back" : "Set aside";
    aside.setAttribute("aria-label", pin.aside ? "Bring back" : "Set aside");
    aside.onclick = e => {
      e.stopPropagation();
      const goingAside = !pin.aside;
      pin.aside = goingAside; pin.folded = goingAside;
      if(goingAside){
        /* setting aside sends it to the bottom, for real, once —
           bringing it back later leaves it exactly where it is */
        const rec = myBoard();
        const idx = rec.pinned.indexOf(pin);
        if(idx > -1){ rec.pinned.splice(idx,1); rec.pinned.push(pin); }
      }
      saveUserBoard(viewing); render();
    };
    controls.appendChild(aside);

    const un = document.createElement("button");
    un.className="icon-btn kill"; un.innerHTML=ICON_X;
    un.title = isBlankNote(deal) ? "Delete this note" : "Take off the board";
    un.setAttribute("aria-label", isBlankNote(deal) ? "Delete this note" : "Take this note off the board");
    un.onclick = e => {
      e.stopPropagation();
      if(isBlankNote(deal)){
        if(!confirm(`Delete "${deal.name}"? It hasn't been converted to a deal, so this removes it from Monday entirely and can't be undone from here.`)) return;
        deleteBlankNote(deal, pin);
        return;
      }
      const n = links.length;
      if(n && !confirm(`Take ${deal.name} off your board? The ${n} ${n===1?"link stays":"links stay"} on the Monday item.`)) return;
      rec.pinned = rec.pinned.filter(p => p !== pin);
      saveUserBoard(viewing); render();
    };
    controls.appendChild(un);

    head.draggable = true;
    head.addEventListener("dragstart", e => {
      dragCard = index;
      e.dataTransfer.effectAllowed="move";
      e.dataTransfer.setData("text/plain","card:"+index);
      card.classList.add("shifting");
    });
    head.addEventListener("dragend", () => {
      dragCard = null;
      document.querySelectorAll(".card").forEach(c => c.classList.remove("shifting","slot"));
    });
  }
  if(controls.children.length) head.appendChild(controls);
  card.appendChild(head);

  const body = document.createElement("div");
  body.className="body";

  const sorted = links.slice().sort((a,b)=>b.ts-a.ts);
  const isOpen = expanded.has(key);
  const shown = isOpen ? sorted : sorted.slice(0, CFG.SHOW_LINKS);
  const hiddenCount = sorted.length - shown.length;

  const ul = document.createElement("ul");
  ul.className="links";
  shown.forEach(l => ul.appendChild(slipEl(l, deal)));
  body.appendChild(ul);

  if(hiddenCount > 0 || (isOpen && sorted.length > CFG.SHOW_LINKS)){
    const btn = document.createElement("button");
    btn.className = "more" + (isOpen ? " open" : "");
    btn.setAttribute("aria-expanded", String(isOpen));
    btn.innerHTML = '<span class="tri">▶</span><span>'+(isOpen?"Show less":hiddenCount+" more")+'</span>';
    btn.onclick = () => { isOpen ? expanded.delete(key) : expanded.add(key); render(); };
    body.appendChild(btn);
  }

  body.appendChild(noteEl(
    "note:"+viewing+":"+key,
    () => isLoose ? rec.looseNote : deal.notes,
    v => {
      if(isLoose){ rec.looseNote = v; saveUserBoard(viewing); }
      else if(v !== deal.notes){ deal.notes = v; saveNotes(deal); touch(deal.id); }
    }
  ));

  if(editable()){
    const hint = document.createElement("div");
    hint.className="hint";
    const s = document.createElement("span");
    s.textContent="Drop a tab here";
    hint.appendChild(s);
    const pb = document.createElement("button");
    pb.className="paste"; pb.textContent="Paste"; pb.title="Paste a link you've copied";
    pb.onclick = () => {
      const txt = (prompt("Copy a link, then paste it here with Ctrl+V (Cmd+V on Mac):") || "").trim();
      if(!txt) return;
      if(!/^https?:\/\//i.test(txt)){ s.textContent="That doesn't look like a link"; return; }
      const link = addLink(txt.split(/\s+/)[0], deal);
      if(!link){ s.textContent="Already on this note"; return; }
      render(link);
    };
    hint.appendChild(pb);
    body.appendChild(hint);

    card.addEventListener("dragover", e => {
      e.preventDefault();
      if(dragCard !== null && !isLoose) card.classList.add("slot");
      else if(dragCard === null) card.classList.add("over");
    });
    card.addEventListener("dragleave", () => card.classList.remove("over","slot"));
    card.addEventListener("drop", e => {
      e.preventDefault();
      card.classList.remove("over","slot");

      /* reordering — never counts as working the deal */
      if(dragCard !== null){
        if(isLoose || dragCard === index) return;
        const [moved] = rec.pinned.splice(dragCard,1);
        rec.pinned.splice(index,0,moved);
        dragCard=null; saveUserBoard(viewing); render(); return;
      }

      /* a link moving between cards */
      if(dragLink){
        const from = dragLink.fromDeal;
        const src = from ? from.links : rec.loose;
        const i = src.findIndex(l => l.id === dragLink.linkId);
        if(i === -1){ dragLink=null; return; }
        const dest = isLoose ? rec.loose : deal.links;
        if(src === dest){ dragLink=null; return; }

        const dupe = dest.some(l => l.url === src[i].url);
        const [moved] = src.splice(i,1);
        if(!dupe){ moved.ts = Date.now(); dest.unshift(moved); }

        if(from){ saveLinks(from); touch(from.id); } else saveUserBoard(viewing);
        if(!isLoose){
          const p = pinOf(deal.id);
          if(p){ p.aside=false; p.folded=false; p.touchedAt=Date.now(); }
          saveLinks(deal); saveUserBoard(viewing);
        }else saveUserBoard(viewing);

        dragLink=null; render(dupe ? undefined : moved); return;
      }

      const uri = e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain");
      if(!uri || !/^https?:\/\//i.test(uri.trim())) return;
      const link = addLink(uri.trim().split("\n")[0], deal);
      if(!link){ s.textContent="Already on this note"; return; }
      render(link);
    });
  }

  card.appendChild(body);

  if(!isLoose){
    const corner = document.createElement("button");
    corner.className="corner";
    corner.title = isFolded ? "Open" : "Close";
    corner.setAttribute("aria-label", isFolded ? "Open card" : "Close card");
    corner.setAttribute("aria-expanded", String(!isFolded));
    corner.onclick = e => {
      e.stopPropagation();
      pin.folded = !pin.folded;
      if(!pin.folded) pin.aside = false;
      saveUserBoard(viewing); render();
    };
    card.appendChild(corner);
  }

  return card;
}

function render(justAdded){
  const rec = myBoard();
  board.innerHTML = "";
  stateEl.style.display = "none";

  /* closed deals fall off after the grace window — the Monday item is untouched.
     A pin whose deal isn't currently loaded is left alone rather than dropped:
     under the targeted-load architecture "not loaded yet" is not proof the deal
     is gone, and a pin must never be erased on a guess. */
  const before = rec.pinned.length;
  rec.pinned = rec.pinned.filter(p => {
    const d = dealsById.get(p.dealId);
    if(!d) return true;
    if(!isClosed(d)) return true;
    return daysLeft(d) > 0;
  });
  if(rec.pinned.length !== before) saveUserBoard(viewing);

  board.appendChild(cardEl({deal:null, pin:null, index:-1}));

  /* order is just the array's real order — set-aside moves a card to the
     end once, on purpose; bringing it back never moves it again */
  const order = rec.pinned.map((p,i) => ({p,i}));

  order.forEach(({p,i}) => {
    const deal = dealsById.get(p.dealId);
    if(!deal) return;
    board.appendChild(cardEl({deal, pin:p, index:i}));
  });

  if(justAdded){
    board.querySelectorAll(".slip").forEach(s => {
      const a = s.querySelector("a");
      if(a && a.href === justAdded.url) s.classList.add("new");
    });
  }
}

/* ============================================================
   Pin modal + new prospect
   ============================================================ */
const veil = document.getElementById("veil");
const search = document.getElementById("search");
const results = document.getElementById("results");
const addNoteBtn = document.getElementById("addNoteBtn");

function nextStickyName(){
  let max = 0;
  deals.forEach(d => {
    const m = /^Sticky Note (\d+)$/i.exec(d.name.trim());
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return "Sticky Note " + (max+1);
}

async function createBlankNote(){
  const name = nextStickyName();
  addNoteBtn.disabled = true;
  saveStart();
  try{
    const data = await api(`
      mutation ($board: ID!, $group: String!, $name: String!) {
        create_item (board_id:$board, group_id:$group, item_name:$name) { id }
      }
    `, {board:String(boardId), group:CFG.STICKY_GROUP, name});
    const id = String(data.create_item.id);
    const deal = {
      id, name, stage:"", address:"", closedAt:null,
      notes:"", links:[], groupId: CFG.STICKY_GROUP,
    };
    deals.push(deal); dealsById.set(id, deal);
    const rec = myBoard();
    rec.pinned.unshift({dealId:id, folded:false, aside:false, touchedAt:Date.now()});
    saveUserBoard(viewing);
    saveDone(true);
    closePin(); render();
  }catch(e){
    console.error(e);
    saveDone(false, "Couldn't create note");
  }finally{
    addNoteBtn.disabled = false;
  }
}

function openPin(){
  if(!editable()) return;
  veil.classList.add("open"); search.value=""; drawResults(""); search.focus();
}
function closePin(){ veil.classList.remove("open"); }

function drawResults(q){
  const rec = myBoard();
  const taken = new Set(rec.pinned.map(p => p.dealId));
  const ql = q.toLowerCase();
  results.innerHTML = "";

  const addLi = document.createElement("li");
  const addBtn = document.createElement("button");
  addBtn.style.cssText = "font-weight:600; color:var(--marker);";
  addBtn.innerHTML = '<span style="flex:none">+</span><span style="flex:1">Add new sticky note</span>';
  addBtn.onclick = createBlankNote;
  addLi.appendChild(addBtn);
  addLi.style.cssText = "border-bottom:1px solid var(--rule); margin-bottom:4px; padding-bottom:4px;";
  results.appendChild(addLi);

  if(!indexReady){
    const li = document.createElement("li");
    li.style.cssText="padding:9px;color:var(--ink-soft);font-size:12.5px";
    li.textContent = "Loading deals…";
    results.appendChild(li);
    return;
  }

  const list = searchIndex
    .filter(d => !taken.has(d.id) && !isClosed(d) && !isBlankNote(d))
    .filter(d => d.name.toLowerCase().includes(ql))
    .slice(0, 40);

  if(!list.length){
    const li = document.createElement("li");
    li.style.cssText="padding:9px;color:var(--ink-soft);font-size:12.5px";
    li.textContent = q ? "No deals match that." : "Everything is pinned already.";
    results.appendChild(li); return;
  }
  list.forEach(d => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    const nm = document.createElement("span");
    nm.textContent = d.name; nm.style.flex="1";
    btn.appendChild(nm);
    if(d.address){
      const addr = document.createElement("span");
      addr.style.cssText = "font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%;";
      addr.textContent = d.address;
      btn.appendChild(addr);
    }
    btn.onclick = async () => {
      if(btn.disabled) return;
      btn.disabled = true;
      try{
        if(!dealsById.has(d.id)){
          const [full] = await loadItemsByIds([d.id]);
          if(full){ deals.push(full); dealsById.set(full.id, full); }
        }
        rec.pinned.unshift({dealId:d.id, folded:false, aside:false, touchedAt:Date.now()});
        saveUserBoard(viewing); closePin(); render();
      }catch(e){
        console.error(e);
        btn.disabled = false;
      }
    };
    li.appendChild(btn); results.appendChild(li);
  });
}

/* ============================================================
   Who am I looking at
   ============================================================ */
const picker = document.getElementById("picker");
const whoSel = document.getElementById("who");
const roBadge = document.getElementById("ro");

function buildPicker(){
  picker.classList.toggle("on", isOwner);
  whoSel.innerHTML = "";
  people.forEach(p => {
    const o = document.createElement("option");
    o.value = p.id;
    o.textContent = p.id === meId ? p.name + " (me)" : p.name;
    whoSel.appendChild(o);
  });
  whoSel.value = viewing;
  whoSel.onchange = async e => {
    viewing = e.target.value;
    expanded.clear(); editing.clear(); renaming.clear(); renamingCard.clear();
    roBadge.classList.toggle("on", !editable());
    addNoteBtn.disabled = !editable();
    stateEl.style.display=""; stateEl.innerHTML = "<strong>Loading</strong>Opening that board.";
    board.innerHTML = "";
    const rec = await loadUserBoard(viewing);
    const missing = rec.pinned.map(p => p.dealId).filter(id => !dealsById.has(id));
    if(missing.length){
      const fetched = await loadItemsByIds(missing);
      fetched.forEach(d => { deals.push(d); dealsById.set(d.id, d); });
    }
    render();
  };
}

addNoteBtn.onclick = openPin;
search.oninput = e => drawResults(e.target.value);
veil.onclick = e => { if(e.target === veil) closePin(); };
document.addEventListener("keydown", e => { if(e.key==="Escape") closePin(); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());

/* ============================================================
   Boot
   ============================================================ */
function fail(msg, detail){
  stateEl.style.display="";
  stateEl.innerHTML = "<strong>"+msg+"</strong>"+(detail||"");
  board.innerHTML = "";
}

monday.listen("context", async res => {
  const c = res.data;
  if(!c) return;
  const bId = c.boardId || (c.boardIds && c.boardIds[0]);
  if(!bId){ fail("No board", "This view needs to be added to a board."); return; }
  if(ctx && String(bId) === String(boardId)) return;  /* already loaded */
  ctx = c; boardId = String(bId);

  try{
    await loadMeta();
    viewing = meId;
    const rec = await loadUserBoard(viewing);
    const [pinnedDeals, stickyDeals] = await Promise.all([
      loadItemsByIds(rec.pinned.map(p => p.dealId)),
      loadStickyGroup(),
    ]);
    const seen = new Map();
    pinnedDeals.forEach(d => seen.set(d.id, d));
    stickyDeals.forEach(d => seen.set(d.id, d));
    deals = Array.from(seen.values());
    dealsById = new Map(deals.map(d => [d.id, d]));

    buildPicker();
    addNoteBtn.disabled = false;
    render();
    loadSearchIndex();  // background — board is already visible by now
  }catch(e){
    console.error(e);
    if(String(e.message).startsWith("SETUP:")){
      fail("Missing columns",
        "This board needs the columns <code>"+String(e.message).slice(6)+
        "</code>. Add them, or change the ids at the top of the app.");
    }else{
      fail("Could not load the board", String(e.message||e));
    }
  }
});
</script>
